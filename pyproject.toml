[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s4is"
version = "0.2.0"
description = "Larsen C SWOT analysis: raw observations to paper figures"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "scipy>=1.14", "h5py>=3.10", "UTide>=0.3.1",
  "pyTMD>=3.0", "timescale>=0.1.3", "xarray>=2024.1", "netCDF4>=1.6",
  "rasterio>=1.3", "pandas>=2.2", "pyproj>=3.5", "matplotlib>=3.8",
  "cmcrameri>=1.9", "pyshp>=2.3", "requests>=2.28", "earthaccess>=0.15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["Code/tests", "tests"]
